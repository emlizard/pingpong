<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>탁구 점수판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: 가로 화면을 탁구대처럼 둘로 나누고, 가운데 흰 센터라인(네트)을 경계로 좌우에 거대한 점수 */
:root {
  --table: #13315c;        /* ITTF 블루 테이블 */
  --table-deep: #0b1f3d;
  --line: #f4f6fb;         /* 테이블 흰 라인 */
  --ink: #f4f6fb;
  --muted: #9fb0cc;
  --red: #ff4d5e;          /* 레드 러버 */
  --ball: #ffb23f;         /* 오렌지 볼 */
  --win: #3ddc97;
  --panel: rgba(8, 20, 42, .92);
  --font-num: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-ui: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--table-deep);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px 8px;
  gap: 6px;
  box-sizing: border-box;
}

/* 상단 바 */
.bar {
  display: flex; align-items: center; gap: 10px;
  min-height: 38px;
}
.fmt { font-weight: 700; font-size: 14px; white-space: nowrap; }
.fmt small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.games { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.games::-webkit-scrollbar { display: none; }
.chip {
  font-family: var(--font-num); font-weight: 500; font-size: 15px;
  padding: 2px 8px; border-radius: 6px;
  background: rgba(255,255,255,.08); color: var(--muted);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip b { color: var(--ink); font-weight: 700; }
.tools { display: flex; gap: 6px; }
.btn {
  font: 700 13px var(--font-ui);
  color: var(--ink); background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 10px; padding: 8px 12px; cursor: pointer;
  white-space: nowrap;
}
.btn:active { background: rgba(255,255,255,.22); }
.btn:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
.btn:disabled { opacity: .35; }
.btn.primary { background: var(--ball); color: #1b1203; border-color: transparent; }

/* 코트 */
.court {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 1fr 4px 1fr;
  border: 3px solid var(--line);
  border-radius: 6px;
  background: var(--table);
  overflow: hidden;
  touch-action: none;
}
.net { background: var(--line); }
.side {
  position: relative;
  display: flex; flex-direction: column;
  min-width: 0; padding: 8px 14px 6px;
  touch-action: none; cursor: ns-resize;
}
.side.flash-up { animation: flashUp .35s ease-out; }
.side.flash-down { animation: flashDown .35s ease-out; }
@keyframes flashUp { from { background: rgba(61,220,151,.22); } to { background: transparent; } }
@keyframes flashDown { from { background: rgba(255,77,94,.2); } to { background: transparent; } }

.head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.name {
  font-weight: 700; font-size: clamp(16px, 4.2dvh, 26px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.serve {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 35%, #fff3d6, var(--ball) 60%, #c97700);
  box-shadow: 0 0 12px rgba(255,178,63,.7);
  visibility: hidden;
}
.side.serving .serve { visibility: visible; }
.sets {
  margin-left: auto; display: flex; align-items: baseline; gap: 6px;
  font-family: var(--font-num); font-weight: 700;
}
.sets .lbl { font: 500 12px var(--font-ui); color: var(--muted); }
.sets .n { font-size: clamp(26px, 8dvh, 48px); line-height: 1; font-variant-numeric: tabular-nums; }

.badge {
  align-self: flex-start; margin-top: 4px;
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 999px;
  background: var(--ball); color: #1b1203;
  visibility: hidden;
}
.badge.on { visibility: visible; }
.badge.match { background: var(--red); color: #fff; }
.badge.deuce { background: var(--line); color: var(--table-deep); }

.score {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.digits {
  font-family: var(--font-num); font-weight: 700;
  font-size: min(68vh, 33vw);
  font-size: min(68dvh, 33vw);
  line-height: .8; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 6px 30px rgba(0,0,0,.35);
}
.side.won .digits { color: var(--win); }
.digits.up { animation: up .22s ease-out; }
.digits.down { animation: down .22s ease-out; }
@keyframes up { from { transform: translateY(18%); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes down { from { transform: translateY(-18%); opacity: .2; } to { transform: none; opacity: 1; } }

.hint {
  text-align: center; font-size: 11px; color: var(--muted);
  letter-spacing: .06em; opacity: .7;
}

/* 게임 종료 배너 */
.banner {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px;
  background: var(--panel); border: 1px solid rgba(255,255,255,.18);
  border-radius: 14px; padding: 10px 12px 10px 18px;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  max-width: calc(100% - 32px); box-sizing: border-box;
  z-index: 5;
}
.banner .t { font-weight: 700; font-size: 16px; }
.banner .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.banner .acts { display: flex; gap: 6px; }

/* 시작/설정 화면 */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(5, 14, 30, .86);
  display: flex; align-items: center; justify-content: center;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.card {
  background: var(--table); border: 3px solid var(--line); border-radius: 8px;
  padding: 16px 20px; width: min(640px, 100%); box-sizing: border-box;
  display: grid; gap: 14px;
}
.card h1 { margin: 0; font-size: 20px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.field input[type=text] {
  font: 700 16px var(--font-ui); color: var(--ink);
  background: var(--table-deep); border: 1px solid rgba(255,255,255,.2);
  border-radius: 10px; padding: 10px 12px; min-width: 0;
}
.field input[type=text]:focus { outline: 2px solid var(--ball); }
.seg { display: flex; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; overflow: hidden; }
.seg label { flex: 1; text-align: center; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 10px 6px; font-weight: 700; font-size: 15px; }
.seg span small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.seg input:checked + span { background: var(--ball); color: #1b1203; }
.seg input:checked + span small { color: #4a3204; }
.seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: -4px; }
.card .go { justify-self: end; font-size: 16px; padding: 12px 22px; }
.rules { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }

/* 세로 모드 안내 */
.rotate {
  position: fixed; inset: 0; z-index: 20;
  background: var(--table-deep);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; text-align: center; padding: 24px;
}
.phone {
  width: 54px; height: 92px; border: 4px solid var(--line); border-radius: 12px;
  animation: turn 2.2s ease-in-out infinite;
}
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
.rotate p { margin: 0; font-weight: 700; font-size: 18px; }
.rotate small { color: var(--muted); }
@media (orientation: portrait) and (max-width: 700px) {
  body:not(.allow-portrait) .rotate { display: flex; }
}

.toast {
  position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  background: var(--red); color: #fff; font-weight: 700; font-size: 15px;
  padding: 8px 16px; border-radius: 999px; z-index: 8;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}

@media (max-height: 360px) {
  .hint { display: none; }
  .bar { min-height: 32px; }
  .btn { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="fmt"><span id="fmtLabel">5세트</span><small id="gameLabel">게임 1</small></div>
    <div class="games" id="games"></div>
    <div class="tools">
      <button class="btn" id="undoBtn" type="button">되돌리기</button>
      <button class="btn" id="swapBtn" type="button">코트 체인지</button>
      <button class="btn" id="newBtn" type="button">새 경기</button>
    </div>
  </header>

  <main class="court" id="court">
    <section class="side" data-slot="0" aria-label="왼쪽 선수">
      <div class="head">
        <span class="swatch"></span><span class="name"></span><span class="serve" title="서브"></span>
        <span class="sets"><span class="lbl">세트</span><span class="n">0</span></span>
      </div>
      <span class="badge"></span>
      <div class="score"><span class="digits">0</span></div>
      <div class="hint">위로 밀면 +1 · 아래로 밀면 −1</div>
    </section>
    <div class="net"></div>
    <section class="side" data-slot="1" aria-label="오른쪽 선수">
      <div class="head">
        <span class="swatch"></span><span class="name"></span><span class="serve" title="서브"></span>
        <span class="sets"><span class="lbl">세트</span><span class="n">0</span></span>
      </div>
      <span class="badge"></span>
      <div class="score"><span class="digits">0</span></div>
      <div class="hint">위로 밀면 +1 · 아래로 밀면 −1</div>
    </section>
  </main>
</div>

<div class="banner" id="banner" hidden>
  <div><div class="t" id="bannerTitle"></div><div class="s" id="bannerSub"></div></div>
  <div class="acts"><button class="btn primary" id="bannerBtn" type="button"></button></div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="overlay" id="setup" hidden>
  <form class="card" id="setupForm">
    <h1>새 경기</h1>
    <div class="field">
      <span>경기 방식</span>
      <div class="seg">
        <label><input type="radio" name="bestOf" id="bo3" value="3"><span>3세트<small>2세트 선승</small></span></label>
        <label><input type="radio" name="bestOf" id="bo5" value="5" checked><span>5세트<small>3세트 선승</small></span></label>
      </div>
    </div>
    <div class="row">
      <label class="field"><span>선수 1 (왼쪽)</span><input type="text" id="name0" maxlength="14" value="선수 A"></label>
      <label class="field"><span>선수 2 (오른쪽)</span><input type="text" id="name1" maxlength="14" value="선수 B"></label>
    </div>
    <div class="field">
      <span>첫 서브</span>
      <div class="seg">
        <label><input type="radio" name="server" id="srv0" value="0" checked><span id="srvLabel0">선수 A</span></label>
        <label><input type="radio" name="server" id="srv1" value="1"><span id="srvLabel1">선수 B</span></label>
      </div>
    </div>
    <p class="rules">11점 선취, 10:10 이후 2점 차. 서브는 2점마다, 듀스부터는 1점마다 교대. 게임마다 코트 체인지, 마지막 게임은 한쪽이 5점이 되면 코트 체인지.</p>
    <button class="btn primary go" type="submit">경기 시작</button>
  </form>
</div>

<div class="rotate">
  <div class="phone"></div>
  <p>휴대폰을 가로로 돌려주세요</p>
  <small>세로 화면 고정이 켜져 있으면 제어 센터에서 해제하세요</small>
  <button class="btn" id="portraitBtn" type="button">세로로 그냥 보기</button>
</div>

<script>
(function () {
  const KEY = 'pingpong-scoreboard-v1';
  const COLORS = ['var(--red)', 'var(--ball)'];
  const $ = (id) => document.getElementById(id);

  const fresh = (bestOf = 5, names = ['선수 A', '선수 B'], server = 0) => ({
    bestOf, names, matchServer: server,
    score: [0, 0], sets: [0, 0], games: [],
    swapped: false, decidingSwapDone: false
  });

  let S = load();
  let history = [];

  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.score) return s; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function snap() { history.push(JSON.stringify(S)); if (history.length > 300) history.shift(); }

  const need = () => (S.bestOf + 1) / 2;
  const other = (p) => 1 - p;

  function gameWinner() {
    for (const p of [0, 1]) {
      if (S.score[p] >= 11 && S.score[p] - S.score[other(p)] >= 2) return p;
    }
    return -1;
  }
  function server() {
    const first = (S.matchServer + S.games.length) % 2;
    const total = S.score[0] + S.score[1];
    const changes = Math.floor(Math.min(total, 20) / 2) + Math.max(0, total - 20);
    return (first + changes) % 2;
  }
  const isDeciding = () => S.sets[0] === need() - 1 && S.sets[1] === need() - 1;

  function change(p, d) {
    if (gameWinner() >= 0 && d > 0) { toast('게임이 끝났어요. 정정은 아래로 밀기'); return; }
    if (d < 0 && S.score[p] === 0) return;
    snap();
    S.score[p] += d;
    if (d > 0 && isDeciding() && !S.decidingSwapDone && S.score[p] === 5 && S.score[other(p)] < 5) {
      S.swapped = !S.swapped; S.decidingSwapDone = true;
      toast('마지막 게임 5점, 코트 체인지');
    }
    save(); render(p, d);
  }

  function nextGame() {
    const w = gameWinner(); if (w < 0) return;
    snap();
    S.games.push([S.score[0], S.score[1]]);
    S.sets[w]++;
    S.score = [0, 0];
    S.swapped = !S.swapped;
    S.decidingSwapDone = false;
    save(); render();
  }

  // ---------- 렌더 ----------
  const sides = [...document.querySelectorAll('.side')];
  const playerAt = (slot) => (S.swapped ? 1 - slot : slot);

  function render(changedP, dir) {
    const w = gameWinner();
    const srv = server();
    $('fmtLabel').textContent = S.bestOf + '세트';
    $('gameLabel').textContent = '게임 ' + (S.games.length + 1) + (isDeciding() ? ' · 마지막' : '');

    sides.forEach((el, slot) => {
      const p = playerAt(slot), o = other(p);
      el.querySelector('.name').textContent = S.names[p];
      el.querySelector('.swatch').style.background = COLORS[p];
      el.querySelector('.sets .n').textContent = S.sets[p];
      const dg = el.querySelector('.digits');
      dg.textContent = S.score[p];
      el.classList.toggle('serving', w < 0 && srv === p);
      el.classList.toggle('won', w === p);

      const b = el.querySelector('.badge');
      b.className = 'badge'; b.textContent = '';
      if (w < 0) {
        const a = S.score[p], c = S.score[o];
        if (a >= 10 && a - c >= 1) {
          const mp = S.sets[p] === need() - 1;
          b.textContent = mp ? '매치 포인트' : '게임 포인트';
          b.classList.add('on'); if (mp) b.classList.add('match');
        } else if (a >= 10 && a === c) {
          b.textContent = '듀스'; b.classList.add('on', 'deuce');
        }
      }
      if (changedP === p && dir) {
        const cls = dir > 0 ? 'up' : 'down';
        dg.classList.remove('up', 'down'); el.classList.remove('flash-up', 'flash-down');
        void dg.offsetWidth;
        dg.classList.add(cls); el.classList.add('flash-' + cls);
      }
    });

    // 지난 게임 기록 (화면 좌/우 순서)
    const gl = playerAt(0), gr = playerAt(1);
    $('games').innerHTML = S.games.map((g, i) => {
      const L = g[gl], R = g[gr];
      return '<span class="chip">G' + (i + 1) + ' ' + (L > R ? '<b>' + L + '</b>' : L) + '-' + (R > L ? '<b>' + R + '</b>' : R) + '</span>';
    }).join('');

    // 배너
    const banner = $('banner');
    if (w >= 0) {
      const sw = S.sets[w] + 1, sl = S.sets[other(w)];
      const matchOver = sw >= need();
      $('bannerTitle').textContent = matchOver
        ? S.names[w] + ' 경기 승리 · 세트 ' + sw + ' : ' + sl
        : S.names[w] + ' 게임 승리 · ' + S.score[w] + ' : ' + S.score[other(w)];
      $('bannerSub').textContent = '점수가 틀렸다면 아래로 밀어 정정';
      $('bannerBtn').textContent = matchOver ? '새 경기' : '다음 게임';
      $('bannerBtn').dataset.act = matchOver ? 'new' : 'next';
      banner.hidden = false;
    } else banner.hidden = true;

    $('undoBtn').disabled = history.length === 0;
  }

  // ---------- 제스처 ----------
  const THRESH = 28;
  sides.forEach((el, slot) => {
    let y0 = null, x0 = null, id = null;
    el.addEventListener('pointerdown', (e) => {
      id = e.pointerId; y0 = e.clientY; x0 = e.clientX;
      try { el.setPointerCapture(id); } catch (_) {}
    });
    const end = (e) => {
      if (e.pointerId !== id || y0 === null) return;
      const dy = e.clientY - y0, dx = e.clientX - x0;
      y0 = null; id = null;
      if (Math.abs(dy) < THRESH || Math.abs(dy) < Math.abs(dx)) return;
      change(playerAt(slot), dy < 0 ? +1 : -1);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { y0 = null; id = null; });
  });
  // iOS 바운스/확대 방지
  document.addEventListener('touchmove', (e) => { if (!e.target.closest('.overlay')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // 키보드 (PC 테스트용): W/S 왼쪽, ↑/↓ 오른쪽
  document.addEventListener('keydown', (e) => {
    if (!$('setup').hidden) return;
    const k = e.key;
    if (k === 'w' || k === 'W') change(playerAt(0), 1);
    else if (k === 's' || k === 'S') change(playerAt(0), -1);
    else if (k === 'ArrowUp') change(playerAt(1), 1);
    else if (k === 'ArrowDown') change(playerAt(1), -1);
  });

  // ---------- 버튼 ----------
  $('undoBtn').onclick = () => {
    if (!history.length) return;
    S = JSON.parse(history.pop()); save(); render();
  };
  $('swapBtn').onclick = () => { snap(); S.swapped = !S.swapped; save(); render(); };
  $('newBtn').onclick = openSetup;
  $('bannerBtn').onclick = (e) => {
    if (e.currentTarget.dataset.act === 'new') openSetup(); else nextGame();
  };
  $('portraitBtn').onclick = () => document.body.classList.add('allow-portrait');

  // ---------- 설정 ----------
  function syncSrvLabels() {
    $('srvLabel0').textContent = $('name0').value.trim() || '선수 1';
    $('srvLabel1').textContent = $('name1').value.trim() || '선수 2';
  }
  $('name0').addEventListener('input', syncSrvLabels);
  $('name1').addEventListener('input', syncSrvLabels);

  function openSetup() {
    const base = S || fresh();
    // 지금 화면 왼쪽/오른쪽 선수 순서로 채움
    $('name0').value = base.names[base.swapped ? 1 : 0];
    $('name1').value = base.names[base.swapped ? 0 : 1];
    $(base.bestOf === 3 ? 'bo3' : 'bo5').checked = true;
    $('srv0').checked = true;
    syncSrvLabels();
    $('setup').hidden = false;
  }
  $('setupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const bestOf = $('bo3').checked ? 3 : 5;
    const names = [$('name0').value.trim() || '선수 1', $('name1').value.trim() || '선수 2'];
    S = fresh(bestOf, names, $('srv1').checked ? 1 : 0);
    history = [];
    save(); render();
    $('setup').hidden = true;
    keepAwake();
  });

  // ---------- 화면 꺼짐 방지 ----------
  let lock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('pointerdown', keepAwake, { once: true });

  // ---------- 토스트 ----------
  let tt;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2200);
  }

  // ---------- 시작 ----------
  if (!S) { S = fresh(); render(); openSetup(); }
  else render();
})();
</script>

</body>
</html>
